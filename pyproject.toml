[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(\.eggs|\.git|\.hg|\.mypy_cache|\.nox|\.tox|\.venv|\.svn|_build|buck-out|build|dist)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "node_modules"]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["ingestao/tests", "ingestao/github_connector/tests", "indexer/tests", "graph/tests", "api/tests", "tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
