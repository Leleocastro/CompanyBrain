name: Indexer CI

on:
  push:
    branches: [main]
    paths:
      - "indexer/**"
      - ".github/workflows/indexer-ci.yml"
  pull_request:
    paths:
      - "indexer/**"
      - ".github/workflows/indexer-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: indexer/requirements-dev.txt
      - run: pip install -r indexer/requirements-dev.txt
      - run: black --check indexer/
      - run: flake8 indexer/
      - run: isort --check-only indexer/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: indexer/requirements-dev.txt
      - run: pip install -r indexer/requirements-dev.txt
      - run: pytest indexer/tests/ --cov=indexer --cov-report=xml
      - uses: codecov/codecov-action@v3
        if: ${{ !cancelled() }}
        with:
          flags: indexer
