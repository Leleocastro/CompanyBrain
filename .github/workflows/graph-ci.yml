name: Graph CI

on:
  push:
    branches: [main]
    paths:
      - "graph/**"
      - ".github/workflows/graph-ci.yml"
  pull_request:
    paths:
      - "graph/**"
      - ".github/workflows/graph-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: graph/requirements-dev.txt
      - run: pip install -r graph/requirements-dev.txt
      - run: black --check graph/
      - run: flake8 graph/
      - run: isort --check-only graph/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: graph/requirements-dev.txt
      - run: pip install -r graph/requirements-dev.txt
      - run: pytest graph/tests/ --cov=graph --cov-report=xml
      - uses: codecov/codecov-action@v3
        if: ${{ !cancelled() }}
        with:
          flags: graph
