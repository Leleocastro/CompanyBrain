name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "api/**"
      - "graph/**"
      - "indexer/**"
      - "ingestao/**"
      - "web/**"
  pull_request:
    paths-ignore:
      - "api/**"
      - "graph/**"
      - "indexer/**"
      - "ingestao/**"
      - "web/**"

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check files
        run: |
          echo "Repository structure is valid"
          ls -la
